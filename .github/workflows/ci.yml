name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Record full dependency audit
        run: npm audit --json > audit-full.json || test "$?" -eq 1
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-full
          path: audit-full.json

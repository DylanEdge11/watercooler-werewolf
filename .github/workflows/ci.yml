name: Verify

on:
  push:
    branches: [main, 'version-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per PR (or per branch for pushes); a newer push cancels the older
# run, except on main where every run finishes.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npx tsc --noEmit --incremental false
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Record full dependency audit
        run: npm audit --json > audit-full.json || test "$?" -eq 1
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-full
          path: audit-full.json

  # The full 20-player API and browser suites run against a disposable local
  # server and database. Hosted UAT relies on these passing for the exact commit.
  # To save Actions minutes they run only for PRs into main or when started by
  # hand; otherwise run them locally (docs/TESTING.md).
  api:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Run the 20-player API suite
        run: node scripts/run-playwright.mjs --project=api
        env:
          E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_INVOCATION_ID: api
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser:
    name: browser (${{ matrix.shard }}/4)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run shard ${{ matrix.shard }} of the Chromium browser suite
        run: node scripts/run-playwright.mjs --project=chromium --fully-parallel --shard=${{ matrix.shard }}/4
        env:
          E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_INVOCATION_ID: shard-${{ matrix.shard }}
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
